<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Open Reopened Task</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <header>
      <img src="icons/icon32.png" alt="" class="logo" />
      <div>
        <h1>Stagecraft</h1>
        <p class="subtitle">Open first Reopened task</p>
      </div>
    </header>

    <div class="card status-card">
      <span class="dot" id="statusDot"></span>
      <div>
        <div class="status-label" id="statusLabel">Ready</div>
        <div class="status-sub" id="statusSub">Click below to open the first Reopened task</div>
      </div>
    </div>

    <div class="tip" id="tipBanner" style="display:none">
      Stagecraft is not open — it will be opened automatically
    </div>

    <div class="claim-result" id="result" style="display:none">
      <span id="resultIcon"></span>
      <span id="resultText"></span>
    </div>

    <div class="actions" style="grid-template-columns:1fr">
      <button id="btnGo" class="btn btn-primary">Open Reopened Task</button>
    </div>

    <div class="flash" id="flash" style="display:none"></div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
